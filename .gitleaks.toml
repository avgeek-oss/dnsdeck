[extend]
useDefault = true

[[allowlists]]
description = "Historical Swift record identity type in the restoration commit, not a credential"
condition = "AND"
commits = ["66079e47f6272a47e5afec51c71512abb73c9350"]
paths = ['''(^|/)DNSDeckUITests/Route53CanaryBackend\.swift$''']
regexTarget = "secret"
regexes = ['''^Route53CanaryRecordKey$''']

[[allowlists]]
description = "Public Keychain field identifier in provider metadata"
condition = "AND"
paths = ['''(^|/)DNSDeck/ProviderDefinitions\.json$''']
regexTarget = "secret"
regexes = ['''^ibmNS1\.apiKey$''']
